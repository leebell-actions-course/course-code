name: Matrix
on: [push]

jobs:
    node-matrix:
        # Now this override fail-fast
        continue-on-error: ${{ matrix.experiment == true }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [14,15,16]
                include:
                    - os: ubuntu-latest
                      is-ubuntu: true
                    - os: macos-latest
                      node-version: 18
                    - experiment: false
                    - os: ubuntu-latest
                      node-version: 16
                      experiment: true
                    - os: ubuntu-latest
                      node-version: 17
                exclude:
                    - os: ubuntu-latest
                      node-version: 14
            # max-parallel: 3
            fail-fast: true
        runs-on: ${{ matrix.os }}        
        steps:
            - if: matrix.experiment == true
              run: exit 1
            - run: node -v
            - run: echo '${{ toJson(matrix) }}'
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
            - run: node -v
