name: Repository Events
on:
    push:
        branches:
            - main
            - "feature/*"   # matches feature/featA, feature/featB, does not match feature/featA/featB
            - "feature/**"  # matches feature/featA, feature/featB, feature/featA/featB
            - "!feature/featA"  #excluding this branch
        tags:
            - v1.*  # match v1.1, v1.1.2
            - '!v1.1.1' # exclude
        paths:
            - "**.js"
            # - "!app.js"
    pull_request:
        types: [opened, assigned, reopened, synchronize]
        branches:
            - main
        paths:      # means pull_request only run with main and changes to js files
            - "**.js"
    issues:
        types: [opened]

jobs:
    checkout-test:
        runs-on: ubuntu-latest
        steps:
            - run: |
                echo $GITHUB_SHA
                echo $GITHUB_REF
            - uses: actions/checkout@v4