name: Calling Reusable Workflows
on:
    workflow_dispatch:
        inputs:
            name:
                description: 'Input description'
                type: string
                default: 'Bill'
                required: false
jobs:
    calling-a-reusable-wf:
        uses: leebell-actions-course/workflows/.github/workflows/reusable.yaml@main
        with:
            name: ${{ inputs.name }}
        secrets:
            access-token: ${{ secrets.ACCESS_TOKEN }}
