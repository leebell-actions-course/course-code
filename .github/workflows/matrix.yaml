name: Matrix
on: [push]

jobs:
    node-matrix:
        # Fail if any is failing
        continue-on-error: false
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [14,15,16]
                include:
                    - os: ubuntu-latest
                      is-ubuntu: true
                    - os: macos-latest
                      node-version: 15
                    - experimental: false
                    - os: ubuntu-latest
                      node-version: 16
                      experiment: true
                    - os: ubuntu-latest
                      node-version: 17
                exclude:
                    - os: ubuntu-latest
                      node-version: 14
            # max-parallel: 3
            fail-fast: false
        runs-on: ${{ matrix.os }}        
        steps:
            - run: node -v
            - run: echo '${{ toJson(matrix) }}'
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
            - run: node -v
